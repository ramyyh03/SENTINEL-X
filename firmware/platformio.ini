[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_port = COM3

; Les builds normaux compilent main.cpp, PAS le mode diagnostic.
build_src_filter = +<*> -<diagnostic.cpp>

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    tzapu/WiFiManager@^2.0.17        ; portail de configuration WiFi (page web)
    knolleary/PubSubClient@^2.8      ; client MQTT
    bblanchon/ArduinoJson@^7.2.0     ; sérialisation JSON du message capteur

; --- DIAGNOSTIC : teste chaque composant en direct, SANS WiFi (pas de crash) ---
;   pio run -d firmware -e esp32dev-diag -t upload   (ou : make.bat flash-diag)
[env:esp32dev-diag]
extends = env:esp32dev
build_src_filter = -<*> +<diagnostic.cpp>

; --- Variante DEV : MQTT EN CLAIR (1883, sans TLS ni certificats) ---
; Pour tester la chaîne complète sans la couche MQTTS/CYBER.
; Flasher avec :  pio run -e esp32dev-plain -t upload
[env:esp32dev-plain]
extends = env:esp32dev
build_flags = -DDEV_PLAIN_MQTT

; --- Variante SECRETS : config EN DUR (secrets.h), SANS portail ni téléphone ---
; Copier include/secrets.h.example -> include/secrets.h, remplir, puis :
;   pio run -e esp32dev-secrets -t upload
[env:esp32dev-secrets]
extends = env:esp32dev
build_flags = -DDEV_PLAIN_MQTT -DUSE_SECRETS

; --- Variante SECRETS + HMAC : config en dur + signature anti-injection ------
; Renseigner SENTINEL_HMAC_SECRET dans secrets.h (= MQTT_HMAC_SECRET du .env PC).
;   pio run -e esp32dev-secrets-hmac -t upload
[env:esp32dev-secrets-hmac]
extends = env:esp32dev
build_flags = -DDEV_PLAIN_MQTT -DUSE_SECRETS -DUSE_HMAC

; --- Variante OLED-ALERTES : affiche les alertes serveur sur l'écran ---------
; L'ESP32 s'abonne à sentinel/alerts (côté PC : ALERT_MQTT_ENABLED=true).
;   pio run -e esp32dev-secrets-oled -t upload
[env:esp32dev-secrets-oled]
extends = env:esp32dev
build_flags = -DDEV_PLAIN_MQTT -DUSE_SECRETS -DOLED_ALERTS

; --- Variante LEDs : LEDs de statut vert(D26)/orange(D14)/rouge(D13) -----------
;   pio run -e esp32dev-secrets-leds -t upload
[env:esp32dev-secrets-leds]
extends = env:esp32dev
build_flags = -DDEV_PLAIN_MQTT -DUSE_SECRETS -DSTATUS_LEDS

; --- Variante COMPLÈTE : secrets + HMAC + OLED-alertes + LEDs (démo finale) ----
;   pio run -e esp32dev-full -t upload
[env:esp32dev-full]
extends = env:esp32dev
build_flags = -DDEV_PLAIN_MQTT -DUSE_SECRETS -DUSE_HMAC -DOLED_ALERTS -DSTATUS_LEDS