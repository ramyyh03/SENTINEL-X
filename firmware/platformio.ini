[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_port = COM3

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    tzapu/WiFiManager@^2.0.17        ; portail de configuration WiFi (page web)
    knolleary/PubSubClient@^2.8      ; client MQTT
    bblanchon/ArduinoJson@^7.2.0     ; sérialisation JSON du message capteur

; --- Variante DEV : MQTT EN CLAIR (1883, sans TLS ni certificats) ---
; Pour tester la chaîne complète sans la couche MQTTS/CYBER.
; Flasher avec :  pio run -e esp32dev-plain -t upload
[env:esp32dev-plain]
extends = env:esp32dev
build_flags = -DDEV_PLAIN_MQTT